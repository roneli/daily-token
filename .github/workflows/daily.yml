name: daily

# Makes one day's issue end to end, publishes it to the issues bucket and Slack, and commits the issue folder to the data repo.
# Sunday to Thursday at the cutoff in DIGEST_TZ. GitHub's cron is UTC, so it fires at both possible UTC hours
# and the first step lets through only the run that lands in the cutoff's local hour: daylight saving needs no edit.
on:
  schedule:
    - cron: "30 15,16 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: Issue date (YYYY-MM-DD); empty means today in DIGEST_TZ
      from:
        description: Restart at a stage (collect, stories, reels, motion, verify)
        default: collect
      motion:
        description: Make a Cutaway; "project" leaves it to pipeline.motion.enabled in project.json
        type: choice
        options: [project, "yes", "no"]
        default: project
      dry_run:
        description: Make and check the issue, but don't publish or commit it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

env:
  DIGEST_TZ: ${{ vars.DIGEST_TZ }}
  CUTOFF: ${{ vars.CUTOFF }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      date: ${{ steps.gate.outputs.date }}
    steps:
      - name: Run only at the cutoff's local hour
        id: gate
        run: |
          date="${{ inputs.date }}"
          [ -z "$date" ] && date=$(TZ="$DIGEST_TZ" date +%F)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ="$DIGEST_TZ" date +%H)" != "${CUTOFF%%:*}" ]; then
            echo "Not ${CUTOFF} in ${DIGEST_TZ} yet; the other scheduled run makes the issue."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  issue:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 45
    env:
      DATE: ${{ needs.gate.outputs.date }}
      # look uses the Chrome the runner image ships, so no browser download.
      LOOK_BROWSER: chrome
    steps:
      # Tags too: issues of an older format render with the engine tagged format-v<N>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile && npm install --global @anthropic-ai/claude-code@2.1.289

      # The motion: ffmpeg films it (Ubuntu's package, GPL, with libx264; the runner image has none), Node runs its
      # voice (Kokoro: its ONNX runtime doesn't load under Bun), and the voice model (about 90 MB), the lines it
      # spoke and the film's fonts are kept between runs, as are the videos already rendered, named by their content.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cache/daily-token
          key: daily-token-voice-${{ github.run_id }}
          restore-keys: daily-token-voice-
      - uses: actions/cache@v4
        with:
          path: out/*/*/motion.*
          key: motion-videos-${{ github.run_id }}
          restore-keys: motion-videos-

      - name: Make the issue
        run: bun src/cli.ts run --root data --date "$DATE" --cutoff "$CUTOFF" --from "${{ inputs.from || 'collect' }}" ${{ inputs.motion == 'yes' && '--motion' || inputs.motion == 'no' && '--no-motion' || '' }}
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Anything to publish?
        id: made
        run: echo "issue=$([ -f data/issues/$DATE/reels.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.made.outputs.issue == 'true'
        run: bun src/render.ts --all --root data && bun src/check.ts --root data --date "$DATE" --look

      - name: Publish to the bucket and Slack
        if: steps.made.outputs.issue == 'true' && !inputs.dry_run
        run: bun src/publish.ts --root data --announce "$DATE"
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit the issue to the data repo
        if: steps.made.outputs.issue == 'true' && !inputs.dry_run
        working-directory: data
        run: |
          git config user.name "The Daily Token"
          git config user.email "daily-token@users.noreply.github.com"
          git add "issues/$DATE"
          git commit -m "Add the issue for $DATE"
          git push

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ needs.gate.outputs.date }}
          path: |
            out/*/${{ needs.gate.outputs.date }}/
            data/issues/${{ needs.gate.outputs.date }}/
          if-no-files-found: ignore
          retention-days: 14
