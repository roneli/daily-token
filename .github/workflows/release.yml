name: release

# A tag v<version> publishes the engine and the starter to npm, at the version both package.json files name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bunx biome check && bunx tsc --noEmit && bun test
      - name: The tag, the engine and the starter name one version
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$v"
          test "$(jq -r .version packages/create/package.json)" = "$v"
          test "$(jq -r '.dependencies["daily-token"]' packages/create/package.json)" = "$v"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        working-directory: packages/create
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
