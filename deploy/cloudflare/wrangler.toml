name = "daily-token"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# For `wrangler dev` only. `daily-token deploy` deploys this Worker with a config it writes from .env: the bucket,
# the domains and the GitHub App. Without the sign-in settings no one signs in, and only public projects and previews show.
[vars]
GITHUB_CLIENT_ID = ""
SITE_DOMAIN = ""

[[r2_buckets]]
binding = "ISSUES"
bucket_name = "daily-token"

[observability]
enabled = true
