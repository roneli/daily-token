name = "daily-token"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# The domain and the Access values are a deployment's, not the engine's: `mise run worker:deploy` passes them
# from .env (WORKER_DOMAIN, ACCESS_TEAM_DOMAIN, ACCESS_AUD). Empty values make the Worker refuse every request.
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[r2_buckets]]
binding = "ISSUES"
bucket_name = "daily-token"

[observability]
enabled = true
